name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Ensure only one deployment runs at a time to prevent race conditions.
# Concurrency limits: GitHub Actions allows at most 1 in-progress run and 1 pending run.
# When rapid successive pushes occur, intermediate pending runs are dropped in favor of the newest.
# cancel-in-progress: false ensures an active deployment finishes safely without aborting mid-flight.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Artifact
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Astro and TypeScript
        run: npx astro check

      - name: Build Static Production Site
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
